<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2D Spaceflight Simulator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas" width="1000" height="700" aria-label="2D Spaceflight Simulator"></canvas>

    <div id="top-bar" class="overlay-bar">
      <div id="mode-indicator">Mode: BUILD</div>
      <div id="flight-stats">
        <span id="fuel-display">Fuel: 0</span>
        <span id="altitude-display">Altitude: 0 m</span>
        <span id="velocity-display">Velocity: 0 m/s</span>
      </div>
      <button id="reset-btn" type="button">Reset / Restart</button>
    </div>

    <div id="left-sidebar">
      <h3>Parts</h3>
      <div id="part-palette">
        <button class="part-item" data-type="nose" type="button">Nose Cone</button>
        <button class="part-item" data-type="capsule" type="button">Command Capsule</button>
        <button class="part-item" data-type="tank" type="button">Fuel Tank</button>
        <button class="part-item" data-type="engine" type="button">Engine</button>
      </div>
      <p class="hint">Select part, move on grid, release mouse to place. Press R to rotate selected part. Right-click to delete.</p>
    </div>

    <div id="bottom-bar" class="overlay-bar">
      <button id="launch-btn" type="button" disabled>Launch</button>
      <div id="throttle-wrap" class="hidden">
        <label for="throttle-slider">Throttle</label>
        <input id="throttle-slider" type="range" min="0" max="100" value="0" step="1" />
        <span id="throttle-value">0%</span>
      </div>
      <button id="thrust-btn" type="button" class="hidden">Main Throttle</button>
      <button id="return-btn" type="button" class="hidden">Return to Build</button>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
